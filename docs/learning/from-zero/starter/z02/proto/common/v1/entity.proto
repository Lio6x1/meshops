syntax = "proto3";

package meshops.common.v1;
option go_package = "example.com/meshops-course/gen/common/v1;commonv1";

// A snapshot describes state; the response envelope identifies the entity.
message EntitySnapshot {
  string entity_type = 1;
  Location location = 3;
  PowerState power = 7;
}

message Location {
  double latitude = 1;
  double longitude = 2;
}

// Missing power means not applicable or unknown, not an empty battery.
message PowerState {
  optional double battery_percent = 1;
}
