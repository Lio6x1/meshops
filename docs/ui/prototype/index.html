<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>MeshOps · 园区协同控制台｜交互设计原型</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#workspace">跳到主要内容</a>
  <aside class="sidebar" aria-label="应用导航">
    <a href="#overview" class="brand" aria-label="MeshOps 总览"><span class="brand-mark">M<span>•</span></span><span>MeshOps<small>园区协同控制台</small></span></a>
    <div class="workspace-label">工作空间 <span>01</span></div>
    <div class="tenant"><span class="tenant-icon">园</span><span>示范园区<small>demo_tenant · 模拟环境</small></span></div>
    <nav id="navigation"></nav>
    <div class="sidebar-bottom"><span class="small-label">DESIGN PREVIEW</span><p>从状态到行动<br>保留每一步的事实。</p><a href="../design.md">查看交互与接口设计 ↗</a></div>
  </aside>
  <div class="app-shell">
    <header class="topbar"><div class="breadcrumb">工作空间 <span>/</span> <strong id="breadcrumb">实体总览</strong></div><div class="topbar-right"><span class="prototype-label">交互设计原型 · 模拟数据</span><span class="avatar" aria-hidden="true">林</span></div></header>
    <main id="workspace" tabindex="-1"></main>
    <footer class="review-panel" aria-label="原型评审工具">
      <span class="review-title">◎ 评审面板</span>
      <label>场景 <select id="scenario"><option value="normal">正常数据</option><option value="loading">加载中</option><option value="empty">空结果</option><option value="error">服务错误</option><option value="disconnected">订阅断开</option><option value="expired">分页已过期</option></select></label>
      <label>身份 <select id="role"><option value="operator">操作员</option><option value="admin">管理员</option></select></label>
      <button class="text-button" id="reset-demo">重置演示</button><span class="review-note">离线运行 · 不连接设备或服务</span>
    </footer>
  </div>
  <dialog id="detail-dialog" aria-labelledby="dialog-title"><div id="dialog-content"></div></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
