name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  GO_VERSION: '1.25.10'

jobs:
  # ==========================================================================
  # 静态检查与单元测试
  # ==========================================================================
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: go vet
        run: go vet ./...

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Run staticcheck
        run: staticcheck ./...

      - name: Run unit tests
        run: go test ./... -count=1

      - name: Run tests with race detector
        run: go test -race ./... -count=1

      - name: Generate coverage report
        run: go test ./... -coverprofile=coverage.out -covermode=atomic

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  # ==========================================================================
  # Protobuf 生成与兼容性检查
  # ==========================================================================
  proto:
    name: Proto Lint & Breaking Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # buf breaking 需要历史

      - name: Setup buf
        uses: bufbuild/buf-setup-action@v1

      - name: Lint proto
        uses: bufbuild/buf-lint-action@v1
        with:
          input: proto

      # 检查是否有破坏性变更（对比main分支）
      - name: Breaking change detection
        uses: bufbuild/buf-breaking-action@v1
        if: github.event_name == 'pull_request'
        with:
          input: proto
          against: 'https://github.com/${{ github.repository }}.git#branch=main,subdir=proto'

  # ==========================================================================
  # 数据库迁移测试
  # ==========================================================================
  migration:
    name: Migration Test
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_root
          MYSQL_DATABASE: meshops_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -ptest_root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -u root -ptest_root --silent; then
              echo "MySQL is ready"
              break
            fi
            sleep 2
          done

      - name: Apply migrations to empty database
        run: |
          for f in migrations/*.sql; do
            echo "Applying $f..."
            mysql -h 127.0.0.1 -u root -ptest_root meshops_test < "$f"
          done

      - name: Verify schema
        run: |
          mysql -h 127.0.0.1 -u root -ptest_root meshops_test -e "SHOW TABLES;"
          mysql -h 127.0.0.1 -u root -ptest_root meshops_test -e "SELECT COUNT(*) FROM integration_sources;"

  # ==========================================================================
  # 服务构建
  # ==========================================================================
  build:
    name: Build Services
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build services
        run: make build

  # ==========================================================================
  # 核心集成测试（依赖 Docker Compose）
  # ==========================================================================
  integration:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Detect integration tests
        id: integration-tests
        shell: bash
        run: |
          if grep -R -l --include='*_test.go' '//go:build integration' . | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No integration-tagged tests yet; dependency startup is skipped."
          fi

      - name: Start dependencies
        if: steps.integration-tests.outputs.present == 'true'
        run: docker compose up -d --wait --wait-timeout 120 kafka redis mysql

      - name: Run integration tests
        if: steps.integration-tests.outputs.present == 'true'
        run: go test ./... -tags=integration -count=1 -timeout=10m
        env:
          KAFKA_BROKERS: localhost:9092
          REDIS_ADDR: localhost:6379
          MYSQL_DSN: root:meshops_dev_root@tcp(localhost:3306)/meshops

      - name: Collect logs on failure
        if: failure() && steps.integration-tests.outputs.present == 'true'
        run: |
          docker compose logs kafka > kafka.log 2>&1 || true
          docker compose logs mysql > mysql.log 2>&1 || true

      - name: Upload failure artifacts
        if: failure() && steps.integration-tests.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: integration-failure-logs
          path: '*.log'

      - name: Teardown
        if: always() && steps.integration-tests.outputs.present == 'true'
        run: docker compose down -v
