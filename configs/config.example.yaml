# ============================================================================
# MeshOps 配置示例
# 用法：复制为 config.local.yaml 并填入实际值；config.local.yaml 不提交 Git
# 密钥通过环境变量注入，不写入配置文件
# ============================================================================

# 通用
app:
  env: development           # development / production
  log_level: info            # debug / info / warn / error
  log_format: json

# ----------------------------------------------------------------------------
# 接入服务
# ----------------------------------------------------------------------------
ingest:
  grpc_addr: 0.0.0.0:50051
  metrics_addr: 0.0.0.0:8080
  # 流控
  max_recv_msg_size: 4194304       # 4MB
  max_concurrent_streams: 200
  max_batch_size: 100              # 单批最大事件数
  rate_limit_per_source: 100       # 每源每秒事件数
  keepalive:
    max_connection_idle: 1h
    max_connection_age: 30m        # 配合服务发现，避免长连接倾斜
    time: 30s
    timeout: 10s

# ----------------------------------------------------------------------------
# Kafka (KRaft 模式)
# ----------------------------------------------------------------------------
kafka:
  brokers:
    - localhost:9092
  # 生产者：可靠性优先
  producer:
    acks: all
    max_retries: 3
    enable_idempotence: true
    compression: snappy
  # 主题
  topics:
    entity_events: entity-state-events.v1
    task_events: task-events.v1
    task_retry_prefix: task-retry       # task-retry.5s.v1, task-retry.30s.v1
    task_dlq: task-dlq.v1
  # 消费者组
  consumer_groups:
    projector: entity-projector
    history_sampler: history-sampler
    realtime_notifier: realtime-notifier
    task_dispatcher: task-dispatcher

# ----------------------------------------------------------------------------
# Redis
# ----------------------------------------------------------------------------
redis:
  addr: localhost:6379
  # password 通过环境变量 REDIS_PASSWORD 注入
  db: 0
  pool_size: 50
  # 快照 TTL
  snapshot_ttl: 168h                # 7天无更新过期

# ----------------------------------------------------------------------------
# MySQL
# ----------------------------------------------------------------------------
mysql:
  # DSN 敏感部分通过环境变量 MYSQL_DSN 注入
  host: localhost
  port: 3306
  database: meshops
  max_open_conns: 50
  max_idle_conns: 10
  conn_max_lifetime: 1h

# ----------------------------------------------------------------------------
# 实体服务
# ----------------------------------------------------------------------------
entity:
  grpc_addr: 0.0.0.0:50052
  metrics_addr: 0.0.0.0:8081
  # 实时订阅
  subscriber_queue_size: 1000       # 单订阅者有界队列大小
  slow_consumer_timeout: 5s         # 慢消费者持续过载后断开
  # 历史抽样
  sampling:
    period: 1s                      # 时间周期
    position_delta_meters: 50       # 位置显著变化阈值
    velocity_delta_percent: 20      # 速度显著变化阈值
    heading_delta_degrees: 30

# ----------------------------------------------------------------------------
# 任务服务
# ----------------------------------------------------------------------------
task:
  grpc_addr: 0.0.0.0:50053
  metrics_addr: 0.0.0.0:8082
  # Outbox 投递器
  outbox:
    poll_interval: 500ms
    batch_size: 100
    published_retention: 24h        # 已发布记录保留期
    unpublished_alert_age: 168h     # 未发布告警阈值（7天）

# ----------------------------------------------------------------------------
# 任务分发器
# ----------------------------------------------------------------------------
dispatcher:
  grpc_addr: 0.0.0.0:50054
  metrics_addr: 0.0.0.0:8083
  # 重试策略
  retry:
    max_attempts: 5
    delays: ["5s", "30s", "5m"]     # 分层延迟主题
  ack_timeout: 30s
  execution_timeout: 5m

# ----------------------------------------------------------------------------
# 参考边缘网关（模拟器）
# ----------------------------------------------------------------------------
gateway:
  bbolt_path: ./data/gateway.db
  max_buffer_bytes: 1073741824      # 1GB
  max_buffer_events: 100000         # 10万条
  oldest_event_alert: 1h
  backfill_rate: 500                # 补传限速 events/s
  compact_threshold_ratio: 2.0      # 文件增长阈值
  compact_confirmed_ratio: 0.8      # 已确认占比阈值

# ----------------------------------------------------------------------------
# etcd (P3)
# ----------------------------------------------------------------------------
etcd:
  enabled: false                    # P0-P2 关闭，P3 开启
  endpoints:
    - localhost:2379
  lease_ttl: 10s                    # 租约 TTL

# ----------------------------------------------------------------------------
# 可观测性
# ----------------------------------------------------------------------------
observability:
  tracing:
    enabled: false                  # P3 开启
    otlp_endpoint: localhost:4317
    sample_ratio: 0.1
